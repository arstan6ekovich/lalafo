{% extends 'base.html' %}
{% block title %}Delete Product{% endblock %}
{% block content %}
<div class="container">
  <h2>Are you sure you want to delete <strong>{{ object }}</strong>?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
  </form>
  <a href="{% url 'product_list' %}" class="back-link">Cancel</a>
</div>
{% endblock %}
