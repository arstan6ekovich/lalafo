<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Products{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Montserrat", sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    h1, h2, h3 {
      color: #222;
    }

    a {
      color: #0984e3;
      text-decoration: none;
      transition: 0.3s;
    }

    a:hover {
      color: #00b894;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 40px;
    }

    img {
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button, .btn {
      background: linear-gradient(135deg, #00b894, #0984e3);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: 500;
    }

    button:hover, .btn:hover {
      background: linear-gradient(135deg, #0984e3, #00b894);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    input, textarea, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: "Montserrat", sans-serif;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
