{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1 style="margin-top: 50px; font-size: 38px;">Categories</h1>

<div style="display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; padding: 40px;">
  {% for category in categories %}
  <div style="
    background: white;
    border-radius: 14px;
    width: 280px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
    cursor: pointer;
    border-top: 4px solid #0984e3;
    text-align: center;
  "
  onmouseover="this.style.transform='translateY(-8px)'; this.style.boxShadow='0 15px 30px rgba(0,0,0,0.15)'"
  onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 8px 20px rgba(0,0,0,0.08)'">

    {% if category.category_photo %}
      <img src="{{ category.category_photo.url }}" alt="{{ category.category_name }}"
           style="width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
    {% endif %}

    <h3 style="font-size: 20px; font-weight: 600; color: #111; margin-bottom: 10px;">
      {{ category.category_name }}
    </h3>

    <a href="{% url 'category_detail' category.pk %}"
       style="display: inline-block; background: linear-gradient(135deg, #0984e3, #00b894);
              color: white; text-decoration: none; padding: 8px 18px; border-radius: 8px;
              font-weight: 500; transition: background 0.3s;">
       View Details
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
