{% extends 'base.html' %}
{% block title %}{% if view.object %}Edit Category{% else %}Add New Category{% endif %}{% endblock %}
{% block content %}
<div class="container">
  {% if view.object %}
    <h1>Edit {{ view.object }}</h1>
  {% else %}
    <h1>Add New Category</h1>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>

  <a href="{% url 'categories_list' %}" class="back-link">Back</a>
</div>
{% endblock %}
